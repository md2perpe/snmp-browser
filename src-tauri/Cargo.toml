[package]
name = "snmp-mib-client"
version = "0.1.6"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "snmp-mib-client"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "snmp_mib_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snmp2 = "0.5"
tree-sitter = "0.26"
tree-sitter-asn1 = { git = "https://github.com/md2perpe/tree-sitter-asn1" }
tree-sitter-yang = { git = "https://github.com/md2perpe/tree-sitter-yang" }
tiny_http = "0.12"
if-addrs = "0.15.0"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "io-util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
russh = "0.63.2"
quick-xml = "0.42.0"

[dev-dependencies]
tempfile = "3"
